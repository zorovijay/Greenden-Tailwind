<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenden-Products</title>
    <link rel="stylesheet" href="output.css">

</head>

<body>
    <!-- Navbar section -->
    <nav class="bg-green-100 p-3 flex justify-between items-center shadow-2xl sticky top-0 z-10">
        <h1 class="text-2xl">Greenden</h1>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="size-6 md:hidden">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        <ul class="text-gray-600 hidden gap-5 md:flex">
            <li><a href="index.html" class="hover:underline hover:text-black">Home</a></li>
            <li><a href="product.html" class="hover:underline hover:text-black">Products</a></li>
            <li><a href="#" class="hover:underline hover:text-black">Contact</a></li>
        </ul>
    </nav>

    <div class="min-h-screen bg-black py-6 flex flex-col justify-center sm:py-12">
        <div class="relative py-3 sm:max-w-xl sm:mx-auto">
            <div
                class="absolute inset-0 bg-linear-to-r from-green-900 to-green-300 shadow-lg transform -skew-y-6 sm:skew-y-0 sm:-rotate-6 sm:rounded-3xl">
            </div>
            <div class="text-white relative px-4 py-10 bg-white shadow-lg sm:rounded-3xl sm:p-20">

                <div class="text-center pb-6">
                    <h1 class="text-3xl text-black mb-4">Contact Us!</h1>

                    <p class="text-black">
                        Fill up the form below to send us a message.
                    </p>
                </div>

                <form>

                    <input
                        class="shadow mb-4 appearance-none border rounded w-full py-2 px-3 text-black leading-tight focus:outline-none focus:shadow-outline"
                        type="text" placeholder="Name" name="name">

                    <input
                        class="shadow mb-4 appearance-none border rounded w-full py-2 px-3 text-black leading-tight focus:outline-none focus:shadow-outline"
                        type="email" placeholder="Email" name="email">

                    <input
                        class="shadow mb-4 appearance-none border rounded w-full py-2 px-3 text-black leading-tight focus:outline-none focus:shadow-outline"
                        type="text" placeholder="Subject" name="_subject">

                    <textarea
                        class="shadow mb-4 min-h-0 appearance-none border rounded h-64 w-full py-2 px-3 text-black leading-tight focus:outline-none focus:shadow-outline"
                        type="text" placeholder="Type your message here..." name="message"
                        style="height: 121px;"></textarea>

                    <div class="flex justify-between">
                        <input
                            class="shadow bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="submit" value="Send ➤">
                        <input
                            class="shadow bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="reset">
                    </div>

                </form>
            </div>
        </div>
    </div>



    <!-- footer -->
    <section class="bg-green-100 p-10 flex flex-col gap-5">
        <h1 class="font-bold text-4xl">Greenden</h1>
        <p>The standard chunk of lorem ipsum used since the 1500s is reproduced below for those interest</p>
        <p>@21 Greenday.com</p>

    </section>
</body>

</html>
